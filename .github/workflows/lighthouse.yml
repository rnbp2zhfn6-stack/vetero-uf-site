name: Website performance checks

on:
  workflow_dispatch:
  schedule:
    - cron: "15 5 * * 1"

permissions:
  contents: read

concurrency:
  group: website-lighthouse
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Lighthouse mobile and desktop
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out site
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Lighthouse CI
        run: npm install --global @lhci/cli@0.16.x

      - name: Audit mobile pages
        run: lhci autorun --config=.lighthouserc.json

      - name: Audit desktop pages
        run: lhci autorun --config=.lighthouserc.desktop.json

      - name: Save Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports-${{ github.run_number }}
          path: |
            lhci-reports/mobile/
            lhci-reports/desktop/
          if-no-files-found: warn
          retention-days: 14
